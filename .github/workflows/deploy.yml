name: Deploy

on:
  workflow_run:                         # ← triggers after ci.yml completes
    workflows: ["CI"]                   # ← must match name: in ci.yml exactly
    types: [completed]
    branches: [feature/prateek]  

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # ← only if CI passed
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Download artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ./publish
          run-id: ${{ github.event.workflow_run.id }}   # ← fetch from CI run ✅
          github-token: ${{ secrets.GITHUB_TOKEN }}

